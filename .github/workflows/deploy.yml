# The workflow name stays "Deploy to Vercel" (the check shows as "Deploy to Vercel / check"); it no longer deploys.
# Vercel's Git integration builds and deploys every push (Production for main, Preview for other branches), so this
# workflow only runs typecheck and tests on main.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time; a newer push waits instead of racing.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
